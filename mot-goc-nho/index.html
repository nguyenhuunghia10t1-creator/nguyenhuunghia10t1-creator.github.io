<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#02040b">
  <meta name="description" content="Một lá thư, một cây hoa anh đào, và một góc nhỏ yên bình.">
  <title>Một góc nhỏ gửi em</title>
  <link rel="icon" href="./assets/flower.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/noto-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/noto-serif-vietnamese-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./fonts.css?v=20261009-r3">
  <link rel="stylesheet" href="./style.css?v=20261010-zoom">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./app.js?v=20261010-zoom"></script>
</head>
<body data-view="locked">
  <main id="app">
    <div id="world" aria-hidden="true"><canvas id="scene"></canvas><div class="world-shade"></div></div>
    <header class="page-header">
      <span class="wordmark"><img src="./assets/flower.svg" width="22" height="22" alt=""> một góc nhỏ</span>
    </header>

    <section id="gate" class="gate" aria-labelledby="page-title">
      <div class="gate-inner">
        <p class="eyebrow"><span></span> Dành riêng cho Nhi</p>
        <h1 id="page-title">Một góc nhỏ<br><em>gửi em.</em></h1>
        <form id="open-form" novalidate>
          <div class="field"><label for="account">Tài khoản</label><input id="account" name="account" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="80" aria-describedby="open-status" placeholder="Thông tin trên tấm thiệp"></div>
          <div class="field"><label for="password">Mật khẩu</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="120" aria-describedby="open-status"><button id="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button></div></div>
          <button class="primary-button" id="open-button" type="submit"><span>Mở thư</span><span class="button-flower" aria-hidden="true">✳</span></button>
          <p id="open-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="letter-view" class="letter-view" hidden aria-labelledby="letter-heading">
      <div class="letter-space">
        <div class="letter-topline"><p class="eyebrow" id="letter-heading">GỬI EM,</p><div class="letter-actions"><button id="letter-reset-button" class="quiet-button" type="button" aria-label="Trở về góc nhìn ban đầu">↺</button><button id="reveal-button" class="quiet-button" type="button">Hiện toàn bộ <span aria-hidden="true">↘</span></button></div></div>
        <div id="particle-stage" class="particle-stage"><canvas id="particle-text" aria-hidden="true"></canvas><div id="particle-copy" aria-live="off"></div><span id="letter-progress" class="letter-progress" aria-hidden="true"></span></div>
        <div id="letter-scroll" class="letter-scroll" tabindex="0" aria-label="Nội dung lời nhắn" hidden><article id="letter-content"></article></div>
        <div class="letter-footer"><button id="replay-button" class="quiet-button" type="button" hidden>Xem lại hiệu ứng <span aria-hidden="true">⤴</span></button><button id="explore-button" class="primary-button" type="button" hidden>Nhìn quanh một chút <span aria-hidden="true">↗</span></button></div>
      </div>
    </section>

    <section id="explore-view" class="explore-view" hidden aria-label="Khám phá cây hoa anh đào">
      <div id="lyrics-zone" class="lyrics-zone" hidden aria-label="Lời bài hát đang phát">
        <div id="lyrics-current" aria-live="off"></div>
        <p id="lyrics-next" aria-hidden="true"></p>
      </div>
      <div class="explore-bottom"><p class="gesture-hint" id="gesture-hint">Em kéo chuột để nhìn quanh, lăn trỏ chuột để zoom in-out.<br><span>Chạm vào người dưới gốc cây và tán hoa sẽ có hiệu ứng.</span></p><div class="scene-actions"><button id="reset-button" class="quiet-button scene-button" type="button"><span aria-hidden="true">↺</span> Góc nhìn ban đầu</button><button id="reread-button" class="quiet-button scene-button" type="button"><span aria-hidden="true">↗</span> Đọc lại thư</button></div></div>
    </section>
    <p id="dialogue" class="dialogue" hidden role="status"></p>
    <p id="scene-status" class="scene-status" role="status">Đang thắp một góc nhỏ…</p>
    <noscript><p class="noscript-message">Em cần bật JavaScript trong trình duyệt để mở lá thư này.</p></noscript>
  </main>
  <aside id="music-root" aria-label="Nhạc của góc nhỏ" hidden></aside>
</body>
</html>
